name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v -m "not endurance"
  test:
    needs: lint
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/python@v7
        with: 
          python-version: ${{matrix.python-version}}
      - run: pip install -r requirements-dev.txt
      - run: pytest -v -m "not endurance"

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
     - run: echo "package placeholder"

  all-green:
    if: always()
    needs: [lint,test,package]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every required job succeeded
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} package=${{ needs.package.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
